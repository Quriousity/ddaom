<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- 바닥: zinc 라운드 스퀘어 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- 문서 -->
  <g>
    <path d="M136 88 h180 l60 60 v276 a20 20 0 0 1 -20 20 H136 a20 20 0 0 1 -20 -20 V108 a20 20 0 0 1 20 -20 z"
          fill="#fafafa"/>
    <!-- 접힌 귀 -->
    <path d="M316 88 l60 60 h-48 a12 12 0 0 1 -12 -12 z" fill="#d4d4d8"/>
    <!-- 본문 줄 -->
    <rect x="152" y="180" width="150" height="18" rx="9" fill="#d4d4d8"/>
    <rect x="152" y="292" width="208" height="18" rx="9" fill="#e4e4e7"/>
    <rect x="152" y="330" width="160" height="18" rx="9" fill="#e4e4e7"/>
    <rect x="152" y="384" width="120" height="18" rx="9" fill="#e4e4e7"/>
  </g>

  <!-- 선택 마퀴 (점선) + 따옴표 -->
  <g>
    <rect x="136" y="212" width="240" height="64" rx="14"
          fill="#6366f1" fill-opacity="0.16"
          stroke="url(#accent)" stroke-width="10"
          stroke-dasharray="26 18" stroke-linecap="round"/>
    <!-- 인용 줄 (선택된 내용) -->
    <rect x="160" y="235" width="118" height="18" rx="9" fill="url(#accent)"/>
    <!-- 닫는 따옴표 ” — 마퀴 안 오른쪽 -->
    <g fill="url(#accent)">
      <path d="M303 231 a11 11 0 1 1 0 22 q1 0 0 0 q11 4 4 -1 q10 12 -4 22 l-7 -7 q8 -6 6 -14 a11 11 0 0 1 1 -22 z"
            transform="translate(0,0)" opacity="0"/>
      <!-- 단순·견고한 형태: 공 + 꼬리 두 개 -->
      <circle cx="305" cy="240" r="10"/>
      <path d="M314 236 q4 18 -12 28 l-6 -8 q11 -6 10 -18 z"/>
      <circle cx="337" cy="240" r="10"/>
      <path d="M346 236 q4 18 -12 28 l-6 -8 q11 -6 10 -18 z"/>
    </g>
  </g>
</svg>
